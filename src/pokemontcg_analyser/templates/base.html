<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa2af;
      --accent: #f2b632;
      --win: #4caf50;
      --loss: #e5534b;
      --tie: #9aa2af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header a { color: var(--text); text-decoration: none; font-weight: 600; }
    header nav { display: flex; gap: 20px; }
    header nav a { color: var(--muted); font-weight: 400; }
    header nav a:hover { color: var(--text); }
    .bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--accent); vertical-align: middle; min-width: 2px; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .chip {
      --c: var(--muted);
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.8em; font-weight: 600;
      background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c);
      border: 1px solid transparent; white-space: nowrap; text-decoration: none;
    }
    .label-misplay { --c: var(--loss); }
    .label-good { --c: var(--win); }
    .label-key { --c: var(--accent); }
    .label-luck { --c: #7aa2f7; }
    .label-topdeck { --c: #9085e9; }
    .form-dot {
      display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
      border-radius: 50%; font-size: 0.75em; font-weight: 700;
    }
    .label-note { --c: #b4bcc8; }
    main { max-width: 960px; margin: 0 auto; padding: 24px; }
    main.wide { max-width: 1440px; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 0.85em; text-transform: uppercase; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: var(--panel); }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 0.85em; font-weight: 600; }
    .badge-win { background: color-mix(in srgb, var(--win) 25%, transparent); color: var(--win); }
    .badge-loss { background: color-mix(in srgb, var(--loss) 25%, transparent); color: var(--loss); }
    .badge-tie { background: color-mix(in srgb, var(--tie) 25%, transparent); color: var(--tie); }
    form.inline { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 16px 0; }
    input, select, button, textarea {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.95em;
    }
    button { cursor: pointer; background: var(--accent); color: #1a1a1a; border: none; font-weight: 600; }
    button:hover { filter: brightness(1.1); }
    button.stop { background: var(--loss); color: #fff; }
    button.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
    video { width: 100%; border-radius: 8px; background: #000; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .panel.highlight { border-color: var(--accent); }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <a href="/">{{ app_name }}</a>
    <nav>
      <a href="/">Matches</a>
      <a href="/decks">Decks</a>
      <a href="/opponents">Opponents</a>
      <a href="/stats">Stats</a>
      <a href="/moments">Moments</a>
      <a href="/weeks">Weeks</a>
    </nav>
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
