[project]
name = "pokemontcg-analyser"
version = "0.1.0"
description = "Record and analyse your own Pokémon TCG Live matches"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "opencv-python-headless>=4.9",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pokemontcg-analyser = "pokemontcg_analyser.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
